{% extends "admin_base.html" %}
{% set active = 'categorias' %}
{% block page_title %}Nueva categoría{% endblock %}
{% block page_sub %}Crea una colección para tu catálogo{% endblock %}
{% block admin_content %}
<div class="card admin-form">
    <form action="{{ url_for('admin_categorias_agregar') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field"><label for="nombre">Nombre</label><input id="nombre" type="text" name="nombre" placeholder="Ej. Ropa de invierno" data-slug-source required></div>
        <div class="field"><label for="slug">Slug (URL)</label><input id="slug" type="text" name="slug" placeholder="ropa-de-invierno" pattern="[a-z0-9-]+" data-slug-target required></div>
        <div class="form-actions"><button class="btn">Crear categoría</button><a href="{{ url_for('admin_categoria') }}" class="btn btn-ghost">Cancelar</a></div>
    </form>
</div>
{% endblock %}
