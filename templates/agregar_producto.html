{% extends "admin_base.html" %}
{% set active = 'productos' %}
{% block page_title %}Nuevo producto{% endblock %}
{% block page_sub %}Agrega una prenda al catálogo{% endblock %}
{% block admin_content %}
<div class="card admin-form">
    <form action="{{ url_for('admin_producto_agregar') }}" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field"><label for="nombre">Nombre</label><input id="nombre" type="text" name="nombre" placeholder="Ej. Polera Oversize Negra" required></div>
        <div class="row2">
            <div class="field"><label for="precio">Precio (CLP)</label><input id="precio" type="number" step="1" min="0" name="precio" placeholder="19990" required></div>
            <div class="field"><label for="stock">Stock</label><input id="stock" type="number" min="0" name="stock" placeholder="10" required></div>
        </div>
        <div class="field"><label for="categoria_id">Categoría</label>
            <select id="categoria_id" name="categoria_id" required>
                <option value="" disabled selected>Selecciona una categoría</option>
                {% for id, nombre in cat_opciones %}<option value="{{ id }}">{{ nombre }}</option>{% endfor %}
            </select>
        </div>
        <div class="field"><label for="descripcion">Descripción</label><textarea id="descripcion" name="descripcion" placeholder="Cuenta qué hace especial a esta prenda" required></textarea></div>
        <div class="field"><label>Imagen</label>
            <label class="dropzone"><i class="fa-solid fa-cloud-arrow-up"></i><span class="dz-label">Arrastra una imagen o haz clic para elegir</span><small>PNG, JPG, GIF o WEBP · máx. 5 MB</small>
                <input type="file" name="imagen" accept="image/*" required></label>
        </div>
        <div class="form-actions"><button class="btn">Guardar producto</button><a href="{{ url_for('admin_producto') }}" class="btn btn-ghost">Cancelar</a></div>
    </form>
</div>
{% endblock %}
