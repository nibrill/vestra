{% extends "base.html" %}
{% block title %}Cambiar correo · VESTRA{% endblock %}
{% block content %}
<div class="container">
    <div class="page-head">
        <nav class="crumbs"><a href="{{ url_for('panel') }}">Mi cuenta</a><i class="fa-solid fa-chevron-right"></i><span>Cambiar correo</span></nav>
        <h1>Cambiar correo</h1>
    </div>
    <div class="card form-narrow">
        <form action="{{ url_for('editar_correo') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field"><label>Correo actual</label><input type="email" value="{{ usuario.correo }}" disabled></div>
            <div class="field"><label for="nuevo_correo">Nuevo correo</label><input id="nuevo_correo" type="email" name="nuevo_correo" placeholder="nuevo@correo.cl" required></div>
            <div class="form-actions">
                <button class="btn">Actualizar correo</button>
                <a href="{{ url_for('panel') }}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
