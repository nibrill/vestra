{% extends "base.html" %}
{% block title %}Cambiar contraseña · VESTRA{% endblock %}
{% block content %}
<div class="container">
    <div class="page-head">
        <nav class="crumbs"><a href="{{ url_for('panel') }}">Mi cuenta</a><i class="fa-solid fa-chevron-right"></i><span>Cambiar contraseña</span></nav>
        <h1>Cambiar contraseña</h1>
    </div>
    <div class="card form-narrow">
        <form action="{{ url_for('editar_password') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field"><label for="password_actual">Contraseña actual</label><input id="password_actual" type="password" name="password_actual" autocomplete="current-password" required><button type="button" class="toggle-pass" aria-label="Mostrar"><i class="fa-regular fa-eye"></i></button></div>
            <div class="field"><label for="nueva_password">Nueva contraseña</label><input id="nueva_password" type="password" name="nueva_password" autocomplete="new-password" minlength="6" required><button type="button" class="toggle-pass" aria-label="Mostrar"><i class="fa-regular fa-eye"></i></button></div>
            <div class="field"><label for="confirmar_password">Confirmar nueva contraseña</label><input id="confirmar_password" type="password" name="confirmar_password" autocomplete="new-password" minlength="6" required></div>
            <div class="form-actions">
                <button class="btn">Actualizar contraseña</button>
                <a href="{{ url_for('panel') }}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
