{% extends "admin_base.html" %}
{% set active = 'resumen' %}
{% block page_title %}Editar usuario{% endblock %}
{% block page_sub %}{{ usuario.correo }}{% endblock %}
{% block admin_content %}
<div class="card admin-form">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field"><label for="nombre">Nombre</label><input id="nombre" type="text" name="nombre" value="{{ usuario.nombre }}" required></div>
        <div class="field"><label for="correo">Correo</label><input id="correo" type="email" name="correo" value="{{ usuario.correo }}" required></div>
        <div class="field"><label for="rol">Rol</label>
            <select id="rol" name="rol">
                <option value="usuario" {% if usuario.rol == 'usuario' %}selected{% endif %}>Usuario</option>
                <option value="admin" {% if usuario.rol == 'admin' %}selected{% endif %}>Administrador</option>
            </select>
        </div>
        <div class="form-actions"><button class="btn">Guardar cambios</button><a href="{{ url_for('admin_panel') }}" class="btn btn-ghost">Cancelar</a></div>
    </form>
</div>
{% endblock %}
