{% extends "admin_base.html" %}
{% set active = 'categorias' %}
{% block page_title %}Editar categoría{% endblock %}
{% block page_sub %}{{ categoria.nombre }}{% endblock %}
{% block admin_content %}
<div class="card admin-form">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field"><label for="nombre">Nombre</label><input id="nombre" type="text" name="nombre" value="{{ categoria.nombre }}" required></div>
        <div class="form-actions"><button class="btn">Guardar cambios</button><a href="{{ url_for('admin_categoria') }}" class="btn btn-ghost">Cancelar</a></div>
    </form>
</div>
{% endblock %}
