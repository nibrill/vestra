{% extends "admin_base.html" %}
{% set active = 'productos' %}
{% block page_title %}Editar producto{% endblock %}
{% block page_sub %}{{ producto.nombre }}{% endblock %}
{% block admin_content %}
<div class="card admin-form">
    <form action="" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field"><label for="nombre">Nombre</label><input id="nombre" type="text" name="nombre" value="{{ producto.nombre }}" required></div>
        <div class="row2">
            <div class="field"><label for="precio">Precio (CLP)</label><input id="precio" type="number" step="1" min="0" name="precio" value="{{ producto.precio|int }}" required></div>
            <div class="field"><label for="stock">Stock</label><input id="stock" type="number" min="0" name="stock" value="{{ producto.stock }}" required></div>
        </div>
        <div class="field"><label for="categoria_id">Categoría</label>
            <select id="categoria_id" name="categoria_id" required>
                {% for id, nombre in cat_opciones %}<option value="{{ id }}" {% if id == producto.categoria_id %}selected{% endif %}>{{ nombre }}</option>{% endfor %}
            </select>
        </div>
        <div class="field"><label for="descripcion">Descripción</label><textarea id="descripcion" name="descripcion" required>{{ producto.descripcion }}</textarea></div>
        <div class="field"><label>Imagen</label>
            <label class="dropzone">
                <img class="dz-preview" src="{{ url_for('static', filename='img/' ~ producto.imagen) }}" alt="">
                <span class="dz-label">Cambiar imagen (opcional)</span><small>PNG, JPG, GIF o WEBP · máx. 5 MB</small>
                <input type="file" name="imagen" accept="image/*"></label>
        </div>
        <div class="form-actions"><button class="btn">Guardar cambios</button><a href="{{ url_for('admin_producto') }}" class="btn btn-ghost">Cancelar</a></div>
    </form>
</div>
{% endblock %}
