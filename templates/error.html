{% extends "base.html" %}
{% block title %}{{ titulo }} · VESTRA{% endblock %}
{% block content %}
<div class="container">
    <div class="success" style="padding:clamp(3rem,10vw,7rem) 0">
        <div style="font-family:var(--font-display);font-weight:800;font-size:clamp(5rem,16vw,10rem);line-height:.9;letter-spacing:-.06em;background:linear-gradient(120deg,var(--gold),#f1dcab 50%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent">{{ codigo }}</div>
        <h1 style="margin-top:1rem">{{ titulo }}</h1>
        <p class="muted" style="margin-bottom:2rem">{{ detalle }}</p>
        <a href="{{ url_for('home') }}" class="btn btn-lg"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>
    </div>
</div>
{% endblock %}
