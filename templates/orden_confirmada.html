{% extends "base.html" %}
{% block title %}¡Compra realizada! · VESTRA{% endblock %}
{% block content %}
<div class="container">
    <div class="success">
        <div class="success__icon"><i class="fa-solid fa-check"></i></div>
        <h1>¡Gracias por tu compra!</h1>
        <p class="muted">Recibimos tu pedido y ya lo estamos preparando.</p>
        <div class="order-no">Pedido #{{ orden_id }}</div>
        <div style="display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap">
            <a href="{{ url_for('historial') }}" class="btn">Ver mis pedidos</a>
            <a href="{{ url_for('home') }}" class="btn btn-ghost">Seguir comprando</a>
        </div>
    </div>
</div>
{% endblock %}
